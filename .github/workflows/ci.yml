name: CI

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".claude/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".claude/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Format check
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "Arquivos nao formatados:"
            echo "$fmt_out"
            exit 1
          fi

      # Nenhum teste depende de Postgres real hoje (self time e so struct em memoria).
      # Se testes de integracao com banco real forem adicionados, precisa de servico
      # postgres aqui (services:) antes desse step.
      - name: Test
        run: go test ./... -v
